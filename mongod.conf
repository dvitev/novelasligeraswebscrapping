# =============================================================================
# MongoDB Configuration - Optimizado para contenedor Docker
# =============================================================================

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 100

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen

processManagement:
  timeZoneInfo: /usr/share/zoneinfo