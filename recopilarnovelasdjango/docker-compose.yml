version: '3.8'

# MongoDB externo: 192.168.1.11:27017 (ya poblado)
# No se necesita contenedor MongoDB

services:
  redis:
    image: redis:7-alpine
    container_name: novelas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: novels_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - static_data:/app/static
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: novels_api_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_data:/app/static
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  static_data: