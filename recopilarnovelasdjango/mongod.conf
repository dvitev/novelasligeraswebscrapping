# MongoDB Configuration File
# Optimized for Docker container

# Storage Configuration
storage:
  dbPath: /data/db
  journal:
    enabled: true

  # WiredTiger Storage Engine Configuration
  wiredTiger:
    engineConfig:
      # Limit cache size to 1GB to prevent excessive memory usage
      cacheSizeGB: 1
      # Use snappy compression for better performance/compression ratio
      journalCompressor: snappy
      # Enable statistics for performance debugging
      statisticsLogDelaySecs: 0

    # Collection Configuration
    collectionConfig:
      # Use snappy compression for collections
      blockCompressor: snappy
      # Index configuration
      indexConfig:
        prefixCompression: true

    # Checkpoint configuration - write to disk every 60 seconds
    checkpoint:
      wait: 60

    # Connection configuration
    connectionConfig:
      # Maximum concurrent connections
      maxConcurrentOverflows: 0
      # Evict idle threads after 1000ms
      evictthreads: 8
      #journal sync period
      logWait: 100

# Operation Profiling
operationProfiling:
  # Enable slowOp profiler to identify slow queries
  mode: slowOp
  # Threshold for slow operations in milliseconds
  slowOpThresholdMs: 100

# Network Configuration
net:
  port: 27017
  bindIp: 0.0.0.0
  # Increase connection pool size
  maxIncomingConnections: 1000
  # Enable wire protocol checks
  wireObjectCheck: true

# Process Management
processManagement:
  # Enable foreground mode for Docker
  foreground: true

# System Log
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  # Verbosity for slow operations
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0
    # Increase verbosity for slow query analysis
    query:
      verbosity: 1
    replication:
      verbosity: 0
    sharding:
      verbosity: 0
    storage:
      verbosity: 0
    journal:
      verbosity: 0

# Security (uncomment for production)
# security:
#   authorization: enabled
#   javascriptEnabled: false

# Set Parameter - Optimize for containerized environment
setParameter:
  enableLocalhostAuthBypass: false
  # Enable connection pool statistics
  wiredTigerConcurrentTransactions: 128