version: '3.8'

# MongoDB externo: 192.168.1.11:27017 (ya poblado)
# No se necesita contenedor MongoDB

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: .env
    networks:
      - novels-network

  api:
    build:
      context: ./recopilarnovelasdjango
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8000/api/health/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - novels-network

  selenium-worker:
    build:
      dockerfile: Dockerfile.selenium-worker
      context: ./recopilarnovelasdjango
    env_file: .env
    environment:
      - DISPLAY=:99
      - C_FORCE_ROOT=true
    command: celery -A recopilarnovelasdjango worker -l info -Q scraping -c 2 --max-tasks-per-child=10
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
    shm_size: "2gb"
    networks:
      - novels-network

  celery-beat:
    build:
      context: ./recopilarnovelasdjango
      dockerfile: Dockerfile
    command: celery -A recopilarnovelasdjango beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - novels-network

  frontend:
    build:
      context: ./recopilarnovelasnextjs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - novels-network

volumes:
  redis_data

networks:
  novels-network:
    driver: bridge